name: Update Mod Portal page
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factorio-light-release
  cancel-in-progress: false
jobs:
  update-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Update and verify public page
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: python3 scripts/publish.py --details-only
