name: QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test build and publication tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download tested Factorio baseline
        run: |
          curl -fSL --retry 3 https://factorio.com/get-download/2.1.24/headless/linux64 -o /tmp/factorio.tar.xz
          tar -xJf /tmp/factorio.tar.xz -C /tmp
      - name: Test the release archive
        env:
          FACTORIO_BIN: /tmp/factorio/bin/x64/factorio
        run: python3 scripts/test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: qa-evidence
          path: |
            dist/
            .testrun/**/*.log
            .testrun/**/script-output/*.json
          include-hidden-files: true
          retention-days: 14
